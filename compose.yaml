services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campusclaw
      POSTGRES_USER: campusclaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusclaw-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusclaw -d campusclaw"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database_data:/var/lib/postgresql/data

  application:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://campusclaw:${POSTGRES_PASSWORD:-campusclaw-local}@database:5432/campusclaw
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-campusclaw_session}
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-1048576}
      MATERIAL_STORAGE_ROOT: /var/lib/campusclaw/materials
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - material_data:/var/lib/campusclaw/materials

volumes:
  database_data:
  material_data:

services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: campusclaw
      POSTGRES_USER: campusclaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusclaw-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusclaw -d campusclaw"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database_data:/var/lib/postgresql/data

  application:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://campusclaw:${POSTGRES_PASSWORD:-campusclaw-local}@database:5432/campusclaw
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-campusclaw}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-campusclaw-browser}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-campusclaw_session}
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-1048576}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-http://host.docker.internal:11434/v1/embeddings}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-5000}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      SEARCH_MAX_QUERY_LENGTH: ${SEARCH_MAX_QUERY_LENGTH:-1000}
      SEARCH_DEFAULT_LIMIT: ${SEARCH_DEFAULT_LIMIT:-10}
      SEARCH_MAX_LIMIT: ${SEARCH_MAX_LIMIT:-50}
      SEARCH_LEXICAL_CANDIDATES: ${SEARCH_LEXICAL_CANDIDATES:-50}
      SEARCH_VECTOR_CANDIDATES: ${SEARCH_VECTOR_CANDIDATES:-50}
      SEARCH_EXCERPT_LENGTH: ${SEARCH_EXCERPT_LENGTH:-240}
      SEARCH_RRF_K: ${SEARCH_RRF_K:-60}
      CHAT_ENDPOINT: ${CHAT_ENDPOINT:-http://host.docker.internal:18081/v1/chat/completions}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-campusclaw-chat}
      CHAT_TIMEOUT_MS: ${CHAT_TIMEOUT_MS:-30000}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-600}
      ASK_MAX_QUESTION_LENGTH: ${ASK_MAX_QUESTION_LENGTH:-2000}
      CONVERSATION_HISTORY_MESSAGES: ${CONVERSATION_HISTORY_MESSAGES:-12}
      CONVERSATION_HISTORY_CHARS: ${CONVERSATION_HISTORY_CHARS:-12000}
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-800}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-80}
      VECTOR_SIMILARITY_THRESHOLD: ${VECTOR_SIMILARITY_THRESHOLD:-0.35}
      MATERIAL_STORAGE_ROOT: /var/lib/campusclaw/materials
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - material_data:/var/lib/campusclaw/materials

volumes:
  database_data:
  material_data:
